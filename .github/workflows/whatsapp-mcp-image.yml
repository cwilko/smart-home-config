name: Build WhatsApp MCP image

# Builds wilkobets/whatsapp-mcp from the upstream Sealjay/mcp-whatsapp Dockerfile at a pinned ref (see
# workloads/fission/workloads/whatsapp/README.md). Manual only: run it when bumping the version in deployment.yaml.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag (or commit SHA) of Sealjay/mcp-whatsapp to build. Also becomes the image tag
        required: true
        default: v0.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: wilkobets/whatsapp-mcp
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sealjay/mcp-whatsapp
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # amd64 only: the Deployment is pinned to amd64 nodes, and an arm64 build of the CGO/ffmpeg image under QEMU is slow.
      # load: true keeps the image local so the next step can inspect it before anything is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: VERSION=${{ inputs.ref }}
          tags: ${{ env.IMAGE }}:${{ inputs.ref }}

      # deployment.yaml sets runAsUser/runAsGroup/fsGroup and mounts the store under the image's home: print what the image
      # actually uses so those values can be checked against this log.
      - name: Show the image's user and home
        run: docker run --rm --entrypoint sh "$IMAGE:$REF" -c 'id; echo "HOME=$HOME"; pwd'

      - name: Push
        run: docker push "$IMAGE:$REF"
