## OpenSSL config for the model-server-grpc mTLS chain (CA + server + client).
## Run generate-certs.sh in this directory to produce the cert/key files, the
## unsealed Secret, and the sealed Secret from this config.
##
## After applying the sealed secret to the cluster (and restarting nginx if it
## doesn't pick it up on its own), verify mTLS is actually being enforced from
## the generated output folder, e.g.:
##
##   cd model-server-grpc.192.168.1.203.nip.io
##
##   # No client cert -> should be REJECTED ("400 No required SSL certificate was sent")
##   curl -sk -v --cacert ca.crt https://model-server-grpc.192.168.1.203.nip.io/
##
##   # With the client cert -> should PASS the cert check (a 502 here is fine -
##   # that's just the gRPC backend not understanding a plain HTTP GET, unrelated
##   # to the certificate)
##   curl -sk -v --cacert ca.crt --cert client.crt --key client.key https://model-server-grpc.192.168.1.203.nip.io/

default_bits = 2048
prompt = no
default_md = sha256

# --- CA ---

[ ca_req ]
distinguished_name = ca_dn

[ ca_dn ]
C = UK
ST = Hampshire
L = Hampshire
O = Squirrel Ltd.
OU = Market Insights
CN = Squirrel Lab Root CA

[ ca_ext ]
basicConstraints = critical,CA:TRUE
keyUsage = critical,keyCertSign,cRLSign

# --- Server cert (model-server-grpc) ---

[ server_req ]
distinguished_name = server_dn

[ server_dn ]
C = UK
ST = Hampshire
L = Hampshire
O = Squirrel Ltd.
OU = Market Insights
emailAddress = email@email.com
CN = model-server-grpc.192.168.1.203.nip.io

[ server_ext ]
subjectAltName = @server_alt_names
extendedKeyUsage = serverAuth
basicConstraints = CA:FALSE

[ server_alt_names ]
DNS.1 = model-server-grpc.192.168.1.203.nip.io

# --- Client cert ---

[ client_req ]
distinguished_name = client_dn

[ client_dn ]
CN = client

[ client_ext ]
extendedKeyUsage = clientAuth
basicConstraints = CA:FALSE
