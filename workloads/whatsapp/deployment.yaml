# WhatsApp MCP server (https://github.com/Sealjay/mcp-whatsapp): one Go process that holds the linked-device session, caches
# messages in SQLite and serves MCP over HTTP at /mcp. This is a plain Deployment, not a Fission function: the session is a
# long-lived websocket with state on disk, so it must stay up (no scale to zero) and must never run twice.
#
# - replicas 1 with the Recreate strategy: two pods on one session (even briefly during a rollout) fight over the link.
#   The server also takes a flock on the store, which the RWO volume backs up.
# - Auth: -allow-remote makes the server refuse to start unless WHATSAPP_MCP_TOKEN is set. It is a bearer token for /mcp and
#   /pair/*, taken from the shared SQUIRREL_API_TOKEN key of the squirrel-api-secret secret in services (see README.md).
#   Without that secret the pod stays in CreateContainerConfigError, which is intended.
# - The image is built from the upstream Dockerfile at a pinned tag (see README.md). It runs as a non-root user; the user and
#   group below must match the image (check with `docker run --rm --entrypoint id <image>`) or the store is not writable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whatsapp-mcp-sa
  namespace: services
automountServiceAccountToken: false

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-mcp
  namespace: services
  labels:
    app: whatsapp-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-mcp
  template:
    metadata:
      labels:
        app: whatsapp-mcp
    spec:
      serviceAccountName: whatsapp-mcp-sa
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: whatsapp-mcp
        image: wilkobets/whatsapp-mcp:v0.6.0
        imagePullPolicy: IfNotPresent
        # The image entrypoint is the whatsapp-mcp binary. Store defaults to ./store under the image's home, which is the
        # mount below.
        args:
        - serve
        - -addr
        - 0.0.0.0:8765
        - -allow-remote
        env:
        # The server only reads WHATSAPP_MCP_TOKEN; the value is the shared SQUIRREL_API_TOKEN.
        - name: WHATSAPP_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: squirrel-api-secret
              key: SQUIRREL_API_TOKEN
        ports:
        - containerPort: 8765
          name: http
        # The server has no health route: a TCP check says the process is serving, not that WhatsApp is connected. For the
        # session itself call the get_status MCP tool (see README.md).
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: store
          mountPath: /home/app/store
      # Sidecar (source in the separate whatsapp-server repository, sidecar/): reads new incoming messages from messages.db and publishes them to MQTT, because the
      # server itself cannot push. It shares the store volume, which has to be mounted read-write even though the program
      # opens the database read-only: SQLite in WAL mode makes even a reader update the -shm file. It runs as the same
      # uid/gid as the server (pod-level securityContext above) so it can read the 0600/0660 files. The broker has no
      # authentication (see ../mosquitto). The image must be built first (whatsapp-server repository, .github/workflows/whatsapp-sidecar-image.yml),
      # otherwise the pod never becomes ready and the MCP endpoint goes down with it.
      - name: mqtt-sidecar
        image: wilkobets/whatsapp-sidecar:v0.1.1
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_PATH
          value: /home/app/store/messages.db
        - name: MQTT_URL
          value: tcp://mqtt.automation.svc.cluster.local:1883
        - name: TOPIC
          value: events/home/device/whatsapp/message-received/priority/INFO
        - name: POLL_INTERVAL
          value: 1s
        # History syncs insert old messages as new rows; anything older than this is skipped, not published.
        - name: MAX_AGE
          value: 10m
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: store
          mountPath: /home/app/store
      volumes:
      - name: store
        persistentVolumeClaim:
          claimName: whatsapp-mcp-data
