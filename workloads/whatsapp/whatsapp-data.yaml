# Pinned (static) volume for the WhatsApp MCP server. Apply this only after the steps in
# smart-home-docs/storage/PERSISTENT-VOLUMES.md, section 3c, are done on TrueNAS:
#   - zvol SSD_pool/k8s/block/pvc-whatsapp-mcp-data exists (a clone of the dynamic volume's migration snapshot), and
#   - the NVMe-oF subsystem k8s-services-whatsapp-mcp-data has that zvol as namespace 2 and is attached to 10.0.0.1:4420.
# Then delete the dynamic claim and its Released PV (see below) and apply this file. pvc.yaml (the dynamic stepping stone)
# is then kept as pvc.yaml.old.
#
# volumeHandle is the zvol name, which is what democratic-csi itself uses for dynamic volumes (confirmed 2 Nov 2026).
# mountOptions are set here because the class's mountOptions only apply to dynamically provisioned PVs; a static PV mounts
# with defaults unless it carries its own.
#
# WhatsApp session (whatsapp.db: the linked-device keys) and message history (messages.db), plus uploaded media.
# Losing this volume means re-pairing the phone. Block storage (ext4) rather than NFS, because both files are SQLite and
# SQLite locking is unreliable over NFS. Reclaim policy is Retain, so deleting the PVC leaves the data behind on TrueNAS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: whatsapp-mcp-data-pv
  annotations:
    pv.kubernetes.io/provisioned-by: org.democratic-csi.nvmeof
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nvmeof
  volumeMode: Filesystem
  mountOptions:
    - discard
    - noatime
  csi:
    driver: org.democratic-csi.nvmeof
    fsType: ext4
    volumeHandle: pvc-whatsapp-mcp-data
    volumeAttributes:
      node_attach_driver: nvmeof
      nqn: nqn.2011-06.com.truenas:uuid:66ed36b2-a5f0-4db8-9a3b-13ef91a18acd:k8s-services-whatsapp-mcp-data
      nsid: "2"  # the namespace was recreated on the renamed subsystem, so it is nsid 2, not 1
      provisioner_driver: freenas-api-nvmeof
      transport: ""
      transports: tcp://10.0.0.1:4420
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-mcp-data
  namespace: services
  labels:
    app: whatsapp-mcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nvmeof
  volumeName: whatsapp-mcp-data-pv  # Binds to the PV above
  resources:
    requests:
      storage: 5Gi  # expanded from 4Gi on 2 Nov 2026 by editing the PVC only; the resizer then updated the PV
