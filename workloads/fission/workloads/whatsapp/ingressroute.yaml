# Exposes the server on the API host at https://api.squirrelhome.co.uk/whatsapp-mcp/ (MCP at /whatsapp-mcp/mcp, QR pairing
# page at /whatsapp-mcp/pair). The server has its own bearer token, but it can send messages as the account and read its
# history, so keep this host LAN-only like the rest of the API routes.
#
# Not a Fission HTTPTrigger (a trigger can only point at a Function), so it does not appear in the /catalog endpoint.
# This rule is more specific than the lowest-priority Fission catch-all on the same host, so it wins over it.
#
# If requests through the ingress get a 403, suspect the server's DNS-rebinding protection (it rejects a non-loopback Host
# header): see README.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whatsapp-mcp-stripprefix
  namespace: services
spec:
  stripPrefix:
    prefixes:
      - /whatsapp-mcp

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whatsapp-mcp-squirrelhome
  namespace: services
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
  - match: Host(`api.squirrelhome.co.uk`) && PathPrefix(`/whatsapp-mcp`)
    kind: Rule
    middlewares:
    - name: whatsapp-mcp-stripprefix
    services:
    - name: whatsapp-mcp
      port: 8765
