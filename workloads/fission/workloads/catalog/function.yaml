# JSON catalog of the endpoints Fission fronts, served at https://api.squirrelhome.co.uk/catalog (see ../../README.md,
# "Endpoint metadata"). The code is src/main.py, embedded below as a literal Package: after editing it,
# replace the `literal` value with the output of:  base64 -i src/main.py | tr -d '\n'
# Needs the `python` Environment in services (../../example/environment.yaml) and the ServiceAccount, token Secret and read access in rbac.yaml.
# newdeploy with MinScale 0 so it scales to zero when idle; the first request after a quiet period is a cold start.
apiVersion: fission.io/v1
kind: Package
metadata:
  name: catalog
  namespace: services
spec:
  environment:
    name: python
    namespace: services
  deployment:
    type: literal
    literal: 
---
apiVersion: fission.io/v1
kind: Function
metadata:
  name: catalog
  namespace: services
spec:
  environment:
    name: python
    namespace: services
  package:
    packageref:
      name: catalog
      namespace: services
  # Mounted into the runtime container at /secrets/services/fission-catalog-token/ (token, ca.crt, namespace)
  secrets:
  - name: fission-catalog-token
    namespace: services
  idletimeout: 60
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: newdeploy
      MinScale: 0
      MaxScale: 1
      SpecializationTimeout: 120
---
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: catalog
  namespace: services
  # Endpoint metadata, see "Endpoint metadata" in ../../README.md
  annotations:
    catalog.squirrelhome.co.uk/description: JSON catalog of the endpoints that Fission fronts, built from the HTTPTrigger annotations
    catalog.squirrelhome.co.uk/kind: rest
    catalog.squirrelhome.co.uk/openapi: https://raw.githubusercontent.com/cwilko/smart-home-config/master/workloads/fission/workloads/catalog/catalog.openapi.yaml
spec:
  relativeurl: /catalog
  method: GET
  functionref:
    type: name
    name: catalog
