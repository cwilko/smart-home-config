apiVersion: v1
data:
  Caddyfile: "# Token-injecting proxy for the WhatsApp pairing QR image only, so it
    can be opened in a plain browser. The WhatsApp MCP server\n# wants \"Authorization:
    Bearer <token>\" on /pair/*, which a browser cannot send. There is no caller authentication
    here:\n# anything that can reach this proxy can see the pairing QR. Internal clients
    only (HTTPS-only ingress, LAN). The token lives\n# only in a Secret in this namespace
    and arrives as an environment variable (see function.yaml).\n#\n# Only the QR
    image is let through; everything else gets a 403, in particular /mcp (the tools
    that send\n# messages) and /pair/reset (the \"Force re-pair\" button, which would
    log the paired session out for anyone who can reach this).\n# While the account
    is paired there is no QR (the server answers 404), so this answers 404 too.\n#\n#
    configmap.yaml is generated from this file, so re-run this after any edit and
    then apply it (run from the pair-proxy directory):\n#   kubectl create configmap
    whatsapp-pair-caddyfile --namespace services --from-file=Caddyfile=config/Caddyfile
    --dry-run=client -o yaml > configmap.yaml\n{\n\tadmin off\n\tauto_https off\n}\n\n(upstream)
    {\n\treverse_proxy whatsapp-mcp.services.svc.cluster.local:8765 {\n\t\t# Replace
    whatever credential the caller sent with the real one. Runtime placeholder env.NAME
    (not the parse-time\n\t\t# form), so the token is not written into the config
    Caddy autosaves.\n\t\theader_up Authorization \"Bearer {env.SQUIRREL_API_TOKEN}\"\n\t\t#
    The server's DNS-rebinding protection may reject a non-loopback Host header; present
    the one it expects.\n\t\theader_up Host 127.0.0.1:8765\n\t}\n}\n\n:8080 {\n\t#
    One prefix trigger reaches this function (see function.yaml), /whatsapp/pair,
    and the Fission router trims the prefix, so\n\t# /whatsapp/pair arrives as /.
    That one request is answered with the server's QR image (its /pair/qr.png), nothing
    else is\n\t# forwarded. The QR rotates and the image does not reload itself, so
    refresh the browser to get the current one. If the\n\t# account is already paired,
    or no QR is ready yet, the server answers 404 and so does this.\n\t@qr {\n\t\tmethod
    GET\n\t\tpath /\n\t}\n\n\thandle @qr {\n\t\trewrite * /pair/qr.png\n\t\timport
    upstream\n\t}\n\thandle {\n\t\trespond \"forbidden\" 403\n\t}\n}\n"
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: whatsapp-pair-caddyfile
  namespace: services
