apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squirrel-stream-ingress-traefik
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: stremio-addon.squirrelnet.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: squirrel-stream
            port:
              number: 3001

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: squid-root-redirect
  namespace: media
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/?$
    replacement: ${1}/api/health
    permanent: false

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squid-api-ingress-traefik
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: media-squid-root-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: squid.squirrelnet.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: squid-service
            port:
              name: api

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: squid-api-stripprefix
  namespace: media
spec:
  stripPrefix:
    prefixes:
      - /squid

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: squid-api-squirrelnet
  namespace: media
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
  - match: (Host(`squirrelnet.co.uk`) || Host(`www.squirrelnet.co.uk`)) && PathPrefix(`/squid`)
    kind: Rule
    middlewares:
    - name: squid-api-stripprefix
    services:
    - name: squid-service
      port: 8080

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: squirrel-stream-stripprefix
  namespace: media
spec:
  stripPrefix:
    prefixes:
      - /stremio-addon

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: squirrel-stream-squirrelnet
  namespace: media
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
  - match: (Host(`squirrelnet.co.uk`) || Host(`www.squirrelnet.co.uk`)) && PathPrefix(`/stremio-addon`)
    kind: Rule
    middlewares:
    - name: squirrel-stream-stripprefix
    services:
    - name: squirrel-stream
      port: 3001
