apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress-traefik
  namespace: automation
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: grafana.squirrelnet.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 80

---

