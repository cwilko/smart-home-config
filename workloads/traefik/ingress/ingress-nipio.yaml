apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-nipio-ingress
  namespace: automation
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: grafana.192.168.1.203.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 80

---

