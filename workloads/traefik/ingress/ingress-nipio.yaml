apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: model-server-grpc-mtls
  namespace: marketinsights
spec:
  clientAuth:
    clientAuthType: RequireAndVerifyClientCert
    secretNames:
      - tls-secret

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: model-server-grpc
  namespace: marketinsights
spec:
  entryPoints:
    - websecure
  tls:
    secretName: tls-secret
    options:
      name: model-server-grpc-mtls
      namespace: marketinsights
  routes:
  - match: Host(`model-server-grpc.192.168.1.203.nip.io`)
    kind: Rule
    services:
    - name: model-server-grpc-service
      port: 8500
      scheme: h2c
