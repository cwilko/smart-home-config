apiVersion: v1
kind: Service
metadata:
  name: node-red-service
  namespace: automation
spec:
  selector:
    app: node-red
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 1880

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red-deployment
  namespace: automation
  labels:
    app: node-red
  annotations:
    fluxcd.io/automated: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: node-red
        image: wilkobets/smart-home-actions:latest
        ports:
        - containerPort: 1880
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: actions-secrets
        volumeMounts:
        - name: data
          mountPath: /data
      # ConfigMap and Secret mounts are read-only, but Node-RED must write flows.json and
      # flows_cred.json. The init container copies the image's /data plus those two files
      # into an emptyDir that is mounted writable at /data. Edits made in the editor are
      # lost on pod restart, and the files are re-seeded from the ConfigMap and Secret.
      initContainers:
      - name: seed-data
        image: wilkobets/smart-home-actions:latest
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - cp -a /data/. /seed/ && cp /seed-flows/flows.json /seed/flows.json && cp /seed-cred/flows_cred.json /seed/flows_cred.json
        volumeMounts:
        - name: data
          mountPath: /seed
        - name: flows
          mountPath: /seed-flows
          readOnly: true
        - name: flows-cred
          mountPath: /seed-cred
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: flows
        configMap:
          name: node-red-flows
      - name: flows-cred
        secret:
          secretName: node-red-flows-cred
